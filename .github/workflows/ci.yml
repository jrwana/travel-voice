name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type check, server + client build, and unit tests.
      - run: npm run check

      # The five verified scenarios replay from recorded fixtures; no API key needed.
      - run: npm run eval
